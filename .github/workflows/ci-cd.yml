name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; the three jobs that need to write grant it to themselves.
# This repo publishes to npm, so lint/test/build — the jobs that execute
# dependency and Playwright code — should not be holding a token that can cut a
# release or push to Pages.
permissions:
  contents: read

# Cancelling is limited to pull_request. This workflow also carries `release`
# and `deploy` on pushes to main, so an unconditional cancel let a rapid second
# merge kill an in-flight semantic-release — potentially between the npm publish
# and the GitHub release/tag that records it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every `Prepare` step below pins `node-version: '24.15.0'`, and it has to.
# The shared action defaults to '24.13.1', which the Angular 22 CLI refuses:
# it wants ^22.22.3 || ^24.15.0 || >=26.0.0 and exits 3 before running
# anything. That failure is invisible in the two cheapest jobs — eslint and
# Jest never invoke the CLI, so `Run Linter` and `Run Tests` stay green while
# `Build Library` and `Storybook Interaction Tests` both die. Keep the pin on
# every job, including the ones that pass without it, so the whole pipeline
# builds on the Node that `engines.node` in package.json declares.
#
# Repeated per step rather than hoisted into a workflow-level `env`: a `with:`
# expression that fails to resolve becomes the empty string, which reaches
# setup-node as "no version" instead of failing, and this is not a value worth
# making conditional on that.

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Run linter
        run: yarn lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Run component tests
        run: yarn test

      - name: Run script tests
        run: yarn test:scripts

  test-storybook:
    name: Storybook Interaction Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: yarn build-storybook

      # `--prefix none` is load-bearing. The runner only reads a `::error::`
      # line as a workflow command when the line starts with it, and
      # concurrently writes `[TEST] ::error…` — so the annotations the Jest
      # reporter in `scripts/ci/` emits would be thrown away silently, which
      # is the exact failure that reporter exists to fix. With no prefix,
      # `--names` fed nothing else and is gone with it; `http-server` runs
      # `--silent`, so almost every line here came from the test command anyway.
      - name: Serve Storybook and run interaction tests
        run: |
          npx concurrently -k -s first --prefix none \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && yarn test-sb --url http://127.0.0.1:6006"

  build:
    name: Build Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Build library
        run: yarn build

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # configure-pages reads the Pages config; upload-pages-artifact signs the
    # artifact that deploy-pages later verifies, which is what id-token is for.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Build Storybook
        run: yarn build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-storybook
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # @semantic-release/github creates the release and tag (contents) and
    # comments on the issues and PRs it ships (issues, pull-requests).
    # npm publishing authenticates with NPM_TOKEN, not the GitHub token, and
    # provenance is not enabled — so no id-token here. `packages: write` was
    # never needed: this publishes to npmjs.org, not GitHub Packages.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for library file changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found — treating as first release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing against last release tag: $LAST_TAG"

          CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- \
            'projects/truenas-ui/src/lib/**' \
            'projects/truenas-ui/src/public-api.ts' \
            'projects/truenas-ui/src/styles/**' \
            'projects/truenas-ui/assets/**' \
            'projects/truenas-ui/scripts/**' \
            'projects/truenas-ui/package.json' \
            'projects/truenas-ui/ng-package.json')

          if [ -z "$CHANGED" ]; then
            echo "No library files changed since $LAST_TAG — skipping release"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Library files changed:"
            echo "$CHANGED"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare
        if: steps.changes.outputs.has_changes == 'true'
        uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
          node-version: '24.15.0'

      - name: Build library
        if: steps.changes.outputs.has_changes == 'true'
        run: yarn build

      - name: Run semantic-release
        if: steps.changes.outputs.has_changes == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
