<header class="tn-dialog__header">
  <!--
    No heading element at all when there is no title, rather than an empty one:
    an `<h2>` with no text is an `empty-heading` violation, and it puts a level-2
    heading with nothing in it into the document outline (#219). The dialog is
    then named by `ariaLabel`/`ariaLabelledby` instead — see the component.
  -->
  @if (hasTitle()) {
    <h2 class="tn-dialog__title" [id]="titleId">{{ title() }}</h2>
  }
  @if (showFullscreenButton()) {
    <!--
      `data-fullscreen` is the language-independent state hook `TnDialogHarness.isFullscreen()`
      reads. The state is also on the panel's `.tn-dialog--fullscreen` class, but the panel is an
      ANCESTOR of this component's host — out of reach for a harness locator, and ambiguous while
      more than one dialog is open. `aria-label` is not the hook: it is now DI-configurable, so a
      translated app would flip the harness's answer. Same call the table's sort-direction toggle
      makes, for the same reason (see `data-sort-direction`).
    -->
    <button
      type="button"
      class="tn-dialog__fullscreen"
      tnTestIdType="button"
      [tnTestId]="fullscreenTestId()"
      [attr.aria-label]="fullscreenLabel()"
      [attr.data-fullscreen]="isFullscreen()"
      (click)="toggleFullscreen()">
      <span class="tn-dialog__fullscreen-icon" aria-hidden="true">{{ isFullscreen() ? '⤓' : '⤢' }}</span>
    </button>
  }
  @if (showCloseButton()) {
    <button type="button" class="tn-dialog__close" tnTestIdType="button" [attr.aria-label]="labels().close" [tnTestId]="closeTestId()" (click)="close()">
      <span class="tn-dialog__close-icon" aria-hidden="true">✕</span>
    </button>
  }
</header>

<section class="tn-dialog__content" cdkDialogContent [class.tn-dialog__content--hidden]="hideContent()">
  <ng-content />
</section>

<footer class="tn-dialog__actions" cdkDialogActions [class.tn-dialog__actions--hidden]="hideActions()">
  <ng-content select="[tnDialogAction]" />
</footer>
