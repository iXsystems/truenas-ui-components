<header class="tn-dialog__header">
  <h2 class="tn-dialog__title" [id]="titleId">{{ title() }}</h2>
  @if (showFullscreenButton()) {
    <button
      type="button"
      class="tn-dialog__fullscreen"
      tnTestIdType="button"
      [tnTestId]="fullscreenTestId()"
      [attr.aria-label]="fullscreenLabel()"
      (click)="toggleFullscreen()">
      <span class="tn-dialog__fullscreen-icon" aria-hidden="true">{{ isFullscreen() ? '⤓' : '⤢' }}</span>
    </button>
  }
  @if (showCloseButton()) {
    <button type="button" class="tn-dialog__close" tnTestIdType="button" [attr.aria-label]="labels().close" [tnTestId]="closeTestId()" (click)="close()">
      <span class="tn-dialog__close-icon" aria-hidden="true">✕</span>
    </button>
  }
</header>

<section class="tn-dialog__content" cdkDialogContent [class.tn-dialog__content--hidden]="hideContent()">
  <ng-content />
</section>

<footer class="tn-dialog__actions" cdkDialogActions [class.tn-dialog__actions--hidden]="hideActions()">
  <ng-content select="[tnDialogAction]" />
</footer>
