<!--
  `ariaRole()` is the only thing declaring how urgently the banner announces:
  it implies the politeness, and an explicit `aria-live` here would override it
  — which is what the static `aria-live="polite"` used to do, downgrading the
  two types deliberately made assertive. See `../a11y/live-region.ts`.
-->
<div
  [ngClass]="classes()"
  [attr.role]="ariaRole()"
>
  @if (hasStructuredContent()) {
    <div class="tn-banner__main">
      <div class="tn-banner__icon">
        <tn-icon
          library="mdi"
          size="md"
          aria-hidden="true"
          [name]="iconName()"
        />
      </div>

      <div class="tn-banner__content">
        @if (heading()) {
          <div class="tn-banner__heading">
            {{ heading() }}
          </div>
        }

        @if (message()) {
          <div class="tn-banner__message">
            {{ message() }}
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="tn-banner__main">
      <ng-content />
    </div>
  }

  @if (hasAction()) {
    <div class="tn-banner__action">
      <ng-content select="[tnBannerAction]" />
    </div>
  }
</div>
