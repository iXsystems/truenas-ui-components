<!-- Capture projected content into a reusable template -->
<ng-template #drawerContent>
  <ng-content />
</ng-template>

<!--
  A CLOSED drawer is `inert` as well as `aria-hidden` (#214). It stays in the DOM
  and keeps whatever the caller projected into it — nav links, buttons — so
  `aria-hidden` alone hid a subtree a keyboard user could still Tab into, landing
  focus on controls that are off-screen or clipped to zero width. `inert` takes
  the subtree out of the focus order and the accessibility tree together;
  `aria-hidden` stays beside it for browsers without `inert` (Firefox before
  112), where it is still the half that works.

  `aria-label` is `resolvedAriaLabel()` in both modes: `dialog` in over mode must
  have a name, and `navigation` in side mode wants one as soon as a page has more
  than one landmark of that role. Beside an `ariaLabelledby` it is the GENERIC
  FALLBACK that is withheld, not an explicit `ariaLabel` — which is always
  emitted, so that a dangling IDREF cannot leave the panel unnamed. That branch
  is `tnAccessibleName`'s, and its reasoning is set out there.
-->

<!--
  THE PANEL IS THE ELEMENT THAT SCROLLS (#270)
  --------------------------------------------
  `.tn-drawer__panel` is `overflow-y: auto`, so whatever a caller projects into
  a drawer scrolls inside this element — and axe's `scrollable-region-focusable`
  reports a scroll container that is neither in the tab order nor holds anything
  that is. `tabindex="-1"` does not answer it: that is a focus TARGET for
  `tnFocusOnOpen`, not a tab stop, and a drawer holding only static content —
  a details pane, a legend — has no tabbable descendant to satisfy the rule
  either. A keyboard user could then not reach the part below the fold.

  So the resting `-1` becomes `0` while the panel actually overflows.
  `panelKeyboardReachable` is `tnScrollableRegion`'s, shared with
  `tn-side-panel` and three others; the component says what it measures and why
  the answer is held true while the panel has focus.

  Only `tabindex` moves. Unlike the side panel's bare `<section>`, this element
  already carries a role and a name in both modes — a named `role="dialog"` or
  `role="navigation"` — so it is announced as itself when focus lands on it, and
  a `role="group"` here would replace the model the drawer declares with a
  description of its scrollbar.

  Both branches carry `#panel`, and only one of them is ever rendered. That is
  what makes the measurement follow a drawer whose `mode` changes at runtime:
  the `@if` destroys one element and builds the other, and the query re-answers.
-->

<!-- Side mode: panel renders inline -->
@if (mode() !== 'over') {
  <div
    #panel
    tnTestIdType="drawer"
    [attr.tabindex]="panelKeyboardReachable() ? '0' : '-1'"
    [class]="drawerClasses()"
    [style.width]="width()"
    [attr.role]="panelRole()"
    [attr.aria-hidden]="!opened() ? 'true' : null"
    [attr.inert]="opened() ? null : ''"
    [attr.aria-label]="resolvedAriaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [tnTestId]="testId()"
    (transitionend)="onTransitionEnd($event)">
    <ng-container *ngTemplateOutlet="drawerContent" />
  </div>
}

<!-- Over mode: portaled to document.body to avoid clipping -->
<div #overlay>
  @if (mode() === 'over') {

    <div
      class="tn-drawer__backdrop"
      aria-hidden="true"
      [class.tn-drawer__backdrop--visible]="opened()"
      (click)="onBackdropClick()"></div>

    <!--
      `cdkTrapFocus` keeps Tab inside the open drawer; what moves focus IN is
      `tnFocusOnOpen` in the component, not `[cdkTrapFocusAutoCapture]`, which
      used to be here and could silently do nothing for a drawer holding no
      tabbable control (#227). `tabindex="-1"` is what makes this element the
      target it focuses — see `../a11y/initial-focus.ts`.
    -->
    <div
      #panel
      #overPanel
      tnTestIdType="drawer"
      [attr.tabindex]="panelKeyboardReachable() ? '0' : '-1'"
      [class]="drawerClasses()"
      [style.width]="width()"
      [attr.role]="panelRole()"
      [attr.aria-modal]="opened() ? 'true' : null"
      [attr.aria-hidden]="!opened() ? 'true' : null"
      [attr.inert]="opened() ? null : ''"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-labelledby]="ariaLabelledby()"
      [tnTestId]="testId()"
      [cdkTrapFocus]="trapFocus()"
      (keydown)="onKeydown($event)"
      (transitionend)="onTransitionEnd($event)">
      <ng-container *ngTemplateOutlet="drawerContent" />
    </div>
  }
</div>
