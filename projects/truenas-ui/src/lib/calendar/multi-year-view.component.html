<table role="grid" class="tn-calendar-table" [attr.aria-label]="gridLabel()">
  <!-- Table body with year cells -->
  <tbody class="tn-calendar-body">
    @for (row of yearRows(); track trackByRow($index, row); let rowIndex = $index) {
      <tr role="row">
        @for (cell of row; track trackByYear($index, cell); let colIndex = $index) {
          <td
            role="gridcell"
            class="tn-calendar-body-cell-container"
            [attr.data-tn-row]="rowIndex"
            [attr.data-tn-col]="colIndex"
            [attr.aria-selected]="cell.selected">
            <button
              type="button"
              class="tn-calendar-body-cell"
              [attr.data-tn-year]="cell.year"
              [class.tn-calendar-body-selected]="cell.selected"
              [class.tn-calendar-body-today]="cell.today"
              [class.tn-calendar-body-active]="cell.year === activeYear()"
              [disabled]="!cell.enabled"
              [attr.tabindex]="cell.year === activeYear() ? 0 : -1"
              [attr.aria-label]="cell.ariaLabel"
              [attr.aria-current]="cell.today ? 'date' : null"
              (click)="onYearClicked(cell)"
              (keydown)="onKeydown($event)">
              <span class="tn-calendar-body-cell-content">
                {{ cell.label }}
              </span>
              <span aria-hidden="true" class="tn-calendar-body-cell-preview"></span>
            </button>
          </td>
        }
      </tr>
    }
  </tbody>
</table>
