<!--
  Overlay wrapper: portaled to document.body.

  A CLOSED panel is `inert` as well as `aria-hidden` (#214). It stays in the DOM
  and keeps its close button and its projected content, so `aria-hidden` alone
  hid a subtree a keyboard user could still Tab into — landing focus on controls
  that are translated off-screen. `inert` takes the subtree out of the focus
  order and the accessibility tree together; `aria-hidden` stays beside it for
  browsers without `inert` (Firefox before 112), where it is still the half that
  works. Same reasoning as the checkbox in `list-option.component.html`.

  `aria-label` and `aria-labelledby` are gated on `open()` for the same reason
  `aria-modal` is: a closed panel is not in the accessibility tree, so a name on
  it would describe nothing. `resolvedAriaLabelledby` prefers the visible
  heading. `resolvedAriaLabel` is `null` when the panel is named by a heading or
  an IDREF and the caller passed no `ariaLabel` of their own — an explicit one is
  always emitted, so that a dangling IDREF cannot leave the panel unnamed.
-->
<div
  #overlay
  class="tn-side-panel__overlay"
  role="dialog"
  tnTestIdType="side-panel"
  [attr.data-tn-panel]="panelId"
  [tnTestId]="testId()"
  [class.tn-side-panel__overlay--initialized]="initialized()"
  [class.tn-side-panel__overlay--open]="open()"
  [attr.aria-modal]="open() ? 'true' : null"
  [attr.aria-labelledby]="open() ? resolvedAriaLabelledby() : null"
  [attr.aria-label]="open() ? resolvedAriaLabel() : null"
  [attr.aria-hidden]="!open() ? 'true' : null"
  [attr.inert]="open() ? null : ''">

  <!-- Backdrop -->
  @if (hasBackdrop()) {
    <div
      class="tn-side-panel__backdrop"
      aria-hidden="true"
      (click)="onBackdropClick()">
    </div>
  }

  <!--
    Panel. `cdkTrapFocus` keeps Tab inside it while it is open; what moves focus
    IN on open is `tnFocusOnOpen` in the component, not
    `[cdkTrapFocusAutoCapture]`, which used to be here and could silently do
    nothing (#227). `tabindex="-1"` is what makes this element the target it
    focuses — see `../a11y/initial-focus.ts` for why the container and not the
    first control inside it.
  -->
  <div
    #panel
    class="tn-side-panel__panel"
    tabindex="-1"
    cdkTrapFocus
    [style.width]="width()"
    (transitionend)="onTransitionEnd($event)"
    (keydown)="onKeydown($event)">

    <!-- Header -->
    <header class="tn-side-panel__header">
      <!--
        No heading element at all when there is no title, rather than an empty
        one: an `<h2>` with no text is an `empty-heading` violation, and it puts
        a level-2 heading with nothing in it into the document outline.
      -->
      @if (hasTitle()) {
        <h2 class="tn-side-panel__title" [id]="titleId">{{ title() }}</h2>
      }
      <div class="tn-side-panel__header-actions">
        <ng-content select="[tnSidePanelHeaderAction]" />
        <tn-icon-button
          name="close"
          library="mdi"
          size="sm"
          [ariaLabel]="closeButtonAriaLabel()"
          [testId]="closeButtonTestId()"
          (onClick)="dismiss()" />
      </div>
    </header>

    <!--
      Content. This is the element that scrolls, and a scrolling element a
      keyboard cannot reach is content below the fold that a keyboard cannot
      read (#248). The panel's own `tabindex="-1"` above does not cover it: that
      is a focus TARGET, not a tab stop, and it is on the container rather than
      on the element with the overflow.

      All three attributes are gated on the same measurement, and the gate is
      the point — an unconditional tab stop would land on every panel in the
      library, including the ones whose content fits, where it announces a group
      and does nothing. `contentScrollable` is what the component measures; see
      `measureContentOverflow`.

      `role="group"` rather than the `region` a named `<section>` would imply:
      `region` is a landmark, and a landmark named the same thing in every panel
      is what `landmark-unique` reports the moment two of them are open. A group
      is not summarised, which is what this is.
    -->
    <section
      #content
      class="tn-side-panel__content"
      [attr.tabindex]="contentScrollable() ? '0' : null"
      [attr.role]="contentScrollable() ? 'group' : null"
      [attr.aria-label]="contentScrollable() ? contentAriaLabel() : null">
      <ng-content />
    </section>

    <!-- Actions -->
    @if (hasActions()) {
      <footer class="tn-side-panel__actions">
        <ng-content select="[tnSidePanelAction]" />
      </footer>
    }
  </div>
</div>
