<div
  #panel
  class="tn-tooltip"
  [id]="id()"
  [attr.role]="sticky() ? 'dialog' : 'tooltip'"
  [attr.aria-label]="sticky() ? panelAriaLabel() : null"
  [class.tn-tooltip--sticky]="sticky()"
  [attr.tabindex]="sticky() ? -1 : null"
  [attr.aria-hidden]="false">
  <div class="tn-tooltip__message" [innerHTML]="message()"></div>

  @if (sticky()) {
    <button
      type="button"
      class="tn-tooltip__close"
      [attr.aria-label]="closeAriaLabel()"
      (click)="onDismiss.emit()">
      <tn-icon name="close" library="mdi" size="xs" />
    </button>
  }
</div>
