<div
  role="tabpanel"
  tnTestIdType="tab-panel"
  [ngClass]="classes()"
  [tnTestId]="testId()"
  [attr.id]="panelId()"
  [attr.aria-hidden]="!isActive()"
  [attr.aria-labelledby]="hasTab() ? tabId() : null"
  [attr.tabindex]="isActive() ? 0 : -1"
>
  @if (shouldRender()) {
    <div class="tn-tab-panel__content">
      <ng-content />
    </div>
  }
</div>
